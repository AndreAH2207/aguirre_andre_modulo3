[project]
name="aguirre-andre-modulo3"
version="0.1.0"
requires-python=">=3.11"
dependencies=[
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "openai>=3.35,<4",
    "openai-agents>=0.24,<0.25",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev=["pytest>=8"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
